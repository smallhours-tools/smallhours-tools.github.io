# Validates the static pages and runs the intake script's tests on every PR and push to main.
# Written by an AI agent (Claude). GitHub-owned actions only; html-validate is pinned in package-lock.json.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
